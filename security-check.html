<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071426">
<title>الفحص الأمني واختيار الصفة | AQX Advertising</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#071426;--line:rgba(160,190,220,.2);--text:#f4f8fc;--muted:#a9bbce;--cyan:#53d6e8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 18% 8%,rgba(36,115,169,.2),transparent 42%),radial-gradient(ellipse at 90% 95%,rgba(44,91,150,.16),transparent 38%),var(--bg);color:var(--text);font-family:Cairo,sans-serif}
main{width:min(100%,760px)}
.brand{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 18px;border:1px solid #53d6e877;border-radius:18px;color:var(--cyan);font-size:20px;font-weight:900;background:#0b2035}
h1{text-align:center;font-size:clamp(24px,5vw,34px)}
.subtitle{text-align:center;color:var(--muted);font-size:14px;line-height:2}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:24px}
.card{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:20px;background:linear-gradient(150deg,#13304d,#091c30);transition:.18s}
.card:hover{transform:translateY(-4px);border-color:#53d6e8aa}
.symbol{width:60px;height:60px;display:grid;place-items:center;margin-bottom:14px;border:1px solid #53d6e855;border-radius:18px;background:#53d6e814;color:var(--cyan);font-size:28px}
.card strong{font-size:22px}
.card span:last-child{margin-top:7px;color:var(--muted);font-size:12px}
@media(max-width:560px){.cards{grid-template-columns:1fr}.card{min-height:165px}}
</style>
</head>
<body>
<main>
<div class="brand">AQX</div>
<h1>التحقق الأمني واختيار الصفة</h1>
<p class="subtitle">اختر الصفة التي تريد استخدامها في AQX Advertising.</p>
<section class="cards" id="role-cards" aria-label="اختيار الصفة">
<a class="card" href="./publisher-terms.html"><span class="symbol">▤</span><strong>ناشر</strong><span>الدخول إلى مسار الناشر ولوحة تحكمه</span></a>
<a class="card" href="./advertiser-terms.html"><span class="symbol">◎</span><strong>معلن</strong><span>الدخول إلى مسار المعلن ولوحة تحكمه</span></a>
</section>
</main>
</body>
</html>
