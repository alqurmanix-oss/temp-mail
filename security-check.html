<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>الفحص الأمني واختيار الصفة | AQX Advertising"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#071426;--line:rgba(160,190,220,.2);--text:#f4f8fc;--muted:#a9bbce;--cyan:#53d6e8;--bad:#ff9b9b;--ok:#72dfb2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 18% 8%,rgba(36,115,169,.2),transparent 42%),radial-gradient(ellipse at 90% 95%,rgba(44,91,150,.16),transparent 38%),var(--bg);color:var(--text);font-family:Cairo,sans-serif}main{width:min(100%,760px)}.brand{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 18px;border:1px solid #53d6e877;border-radius:18px;color:var(--cyan);font-size:20px;font-weight:900;background:#0b2035}h1{text-align:center;font-size:clamp(24px,5vw,34px)}.subtitle{text-align:center;color:var(--muted);font-size:14px;line-height:2}.panel{margin:24px auto;padding:22px;border:1px solid var(--line);border-radius:18px;background:#0d2037;text-align:center}.cards{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.cards.show{display:grid}.card{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:20px;background:linear-gradient(150deg,#13304d,#091c30);transition:.18s}.card:hover{transform:translateY(-4px);border-color:#53d6e8aa}.symbol{width:60px;height:60px;display:grid;place-items:center;margin-bottom:14px;border:1px solid #53d6e855;border-radius:18px;background:#53d6e814;color:var(--cyan);font-size:28px}.card strong{font-size:22px}.card span:last-child{margin-top:7px;color:var(--muted);font-size:12px}.msg{font-size:13px;line-height:2;color:var(--muted)}.msg.error{color:var(--bad)}.msg.success{color:var(--ok)}.captcha{display:flex;justify-content:center;margin:16px auto}.btn{border:0;border-radius:11px;padding:11px 24px;background:linear-gradient(100deg,#42c9dc,#428ee0);color:#061827;font:800 14px Cairo;cursor:pointer}.btn:disabled{opacity:.5}@media(max-width:560px){.cards{grid-template-columns:1fr}.card{min-height:165px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=aqxTurnstileReady&render=explicit" async defer></script></head>
<body><main><div class="brand">AQX</div><h1>التحقق الأمني واختيار الصفة</h1><p class="subtitle">أكمل التحقق الأمني أولًا، ثم اختر صفتك في AQX Advertising.</p><section class="panel" id="security-panel"><div class="msg" id="security-message">جارٍ التحقق من جلسة الدخول وإثباتها…</div><div class="captcha" id="turnstile-box"></div><button class="btn" id="verify-button" type="button" hidden>إكمال الفحص الأمني</button></section><section class="cards" id="role-cards" aria-label="اختيار الصفة"><a class="card" href="./publisher-terms.html" data-role="publisher"><span class="symbol">▤</span><strong>ناشر</strong><span>الدخول إلى مسار الناشر ولوحة تحكمه</span></a><a class="card" href="./advertiser-terms.html" data-role="advertiser"><span class="symbol">◎</span><strong>معلن</strong><span>الدخول إلى مسار المعلن ولوحة تحكمه</span></a></section></main>
<script>
(()=>{const U="https://fkiokwwztbyztleeuwks.supabase.co",K="sb_publishable_4DCXObCqPUoNnI8ANOo8dA_nRAg0y5_",API=U+"/functions/v1/aqx-identity";const client=window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let captchaToken="",widget=null,session=null,proof=null;const $=id=>document.getElementById(id);function msg(t,c=""){ $("security-message").textContent=t;$("security-message").className="msg "+c}
window.aqxTurnstileReady=()=>{if(!$("turnstile-box")||widget!==null)return;const key="0x4AAAAAAF3T0LhduY-AjZNc";widget=turnstile.render("#turnstile-box",{sitekey:key,callback:t=>{captchaToken=t;$("verify-button").hidden=false}, "expired-callback":()=>{captchaToken=""}})};
async function init(){try{const s=await client.auth.getSession();session=s.data?.session;if(!session?.access_token)throw Error("LOGIN_REQUIRED");const raw=sessionStorage.getItem("aqx_identity_login_proof");const token=sessionStorage.getItem("aqx_identity_session_token");proof=raw?JSON.parse(raw):null;if(!token||!proof?.token)throw Error("LOGIN_PROOF_MISSING");msg("أكمل فحص الحماية ثم اضغط زر إكمال الفحص الأمني.");$("verify-button").hidden=false;if(window.turnstile&&widget===null)window.aqxTurnstileReady()}catch(e){msg(e.message==="LOGIN_REQUIRED"?"لا توجد جلسة دخول صالحة. ارجع إلى صفحة تسجيل الدخول.":"بيانات إثبات الدخول غير متاحة أو انتهت. سجّل الدخول مرة أخرى.","error");}}
$("verify-button").addEventListener("click",async()=>{if(!captchaToken){msg("أكمل اختبار التحقق الأمني أولًا.","error");return}const b=$("verify-button");b.disabled=true;try{const r=await fetch(API+"/v1/security/login-proof/consume",{method:"POST",headers:{"Content-Type":"application/json","apikey":K,Authorization:"Bearer "+session.access_token,"x-aqx-session":sessionStorage.getItem("aqx_identity_session_token")},body:JSON.stringify({proof_token:proof.token,captcha_token:captchaToken})});const j=await r.json().catch(()=>({}));if(!r.ok||j.valid!==true)throw Error(j.error||"LOGIN_PROOF_INVALID_OR_EXPIRED");sessionStorage.removeItem("aqx_identity_login_proof");$("security-panel").style.display="none";$("role-cards").classList.add("show")}catch(e){msg("تعذر إكمال الفحص الأمني: "+e.message,"error");b.disabled=false;if(window.turnstile&&widget!==null)turnstile.reset(widget);captchaToken=""}});

async function openRole(role,link){link.style.pointerEvents="none";msg("جارٍ التحقق من موافقتك السابقة لدى الهوية المركزية…");try{const r=await fetch(API+"/v1/advertising/onboarding/status",{method:"POST",headers:{"Content-Type":"application/json","apikey":K,Authorization:"Bearer "+session.access_token},body:"{}"});const j=await r.json();if(!r.ok||j.success!==true)throw Error(j.error||"STATUS_UNAVAILABLE");const versions=j.active_versions||{},record=j.roles?.[role];const terms=role==="publisher"?versions.publisher_terms:versions.advertiser_terms;const accepted=record&&record.terms_version===terms&&record.privacy_version===versions.privacy;location.assign(accepted?(role==="publisher"?"./publisher-dashboard.html":"./advertiser-dashboard.html"):(role==="publisher"?"./publisher-terms.html":"./advertiser-terms.html"))}catch(e){msg("تعذر التحقق من حالة الانضمام. لم يتم فتح لوحة التحكم. أعد المحاولة.","error");link.style.pointerEvents=""}}
document.querySelectorAll(".card[data-role]").forEach(link=>link.addEventListener("click",e=>{e.preventDefault();openRole(link.dataset.role,link)}));
init();
})();
</script></body></html>
