.banner{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:space-between;gap:clamp(10px,3vw,36px);width:100%;max-width:1200px;min-height:clamp(112px,20vw,230px);margin:auto;padding:clamp(16px,4vw,42px);overflow:hidden;border:1px solid rgba(0,201,192,.45);border-radius:clamp(12px,2vw,22px);background:radial-gradient(ellipse at 15% 20%,rgba(0,201,192,.22),transparent 42%),linear-gradient(115deg,#06152d 0%,#0a2b49 55%,#071b38 100%);box-shadow:0 14px 38px rgba(0,18,43,.32);color:var(--white);text-decoration:none}
.banner:before,.banner:after{content:"";position:absolute;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(2px)}
.banner:before{width:clamp(110px,22vw,250px);height:clamp(110px,22vw,250px);left:-5%;top:-48%;background:rgba(0,201,192,.17);animation:float 7s ease-in-out infinite alternate}
.banner:after{width:clamp(90px,16vw,180px);height:clamp(90px,16vw,180px);right:36%;bottom:-65%;background:rgba(240,208,96,.12);animation:float 8s ease-in-out infinite alternate-reverse}
.copy{min-width:0;position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 10px;color:var(--gold);font-size:clamp(10px,1.4vw,14px);font-weight:700;letter-spacing:.3px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(0,201,192,.65);animation:pulse 1.8s infinite}
h1{margin:0;color:#fff;font-size:clamp(21px,4.3vw,48px);line-height:1.25;font-weight:800}
h1 span{color:var(--teal);text-shadow:0 0 22px rgba(0,201,192,.25)}
p{margin:9px 0 0;color:#d7e8f2;font-size:clamp(11px,1.7vw,17px);line-height:1.7}
.cta{position:relative;z-index:1;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:clamp(38px,5.5vw,54px);padding:0 clamp(13px,2.5vw,25px);border:1px solid rgba(255,255,255,.25);border-radius:999px;background:linear-gradient(110deg,#00bdb6,#00d5c9);color:#04243a;font-size:clamp(11px,1.5vw,15px);font-weight:800;white-space:nowrap;box-shadow:0 8px 24px rgba(0,201,192,.22);transition:transform .25s ease,box-shadow .25s ease}
.banner:hover .cta{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,201,192,.38)}
.arrow{font-size:1.3em;animation:nudge 1.5s ease-in-out infinite}
.spark{position:absolute;z-index:-1;width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.8;animation:twinkle 3s ease-in-out infinite}
.s1{top:18%;left:42%}.s2{top:70%;left:18%;animation-delay:1s}.s3{top:28%;right:9%;animation-delay:1.7s}
@keyframes float{to{transform:translate(24px,18px) scale(1.12)}}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(0,201,192,0)}100%{box-shadow:0 0 0 0 rgba(0,201,192,0)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-4px)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.5)}}
@media(max-width:480px){.banner{align-items:flex-start;flex-direction:column;justify-content:center;gap:13px;min-height:150px}.cta{align-self:flex-start}.banner:after{right:65%;bottom:-45%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
