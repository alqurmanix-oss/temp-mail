<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQX Mobile Dashboard</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 15px; margin: 0; }
        .container { max-width: 100%; margin: 0 auto; }
        h1 { color: #38bdf8; font-size: 1.5rem; text-align: center; margin-bottom: 20px; }
        .card { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px: #334155; }
        label { font-size: 0.85rem; color: #94a3b8; display: block; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin-top: 5px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 1rem; }
        button { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 15px; font-size: 1rem; cursor: pointer; }
        button.danger { background: #ef4444; color: #fff; }
        #result { background: #070a12; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; margin-top: 10px; max-height: 200px; overflow-y: auto; color: #38bdf8; }
    </style>
</head>
<body>
<div class="container">
    <h1>AQX Mobile Control</h1>

    <div class="card">
        <h3>إضافة مكون جديد</h3>
        <label>المعرف (Document ID)</label>
        <input type="text" id="docId" value="ing_banana_raw_100g">
        
        <label>الاسم بالعربية</label>
        <input type="text" id="nameAr" value="موز، طازج">

        <label>السعرات الحرارية</label>
        <input type="number" id="calories" value="89">

        <button onclick="sendData('CREATE')">إضافة للقاعدة</button>
    </div>

    <div class="card">
        <h3>بحث أو جلب مكون</h3>
        <label>المعرف أو كلمة البحث</label>
        <input type="text" id="searchKey" value="ing_banana_raw_100g">
        
        <button onclick="sendData('READ')">جلب بالمعرف</button>
        <button onclick="sendData('SEARCH')" style="background: #22c55e; color:#fff;">بحث ذكي</button>
    </div>

    <div class="card">
        <h3>النتيجة</h3>
        <div id="result">في الانتظار...</div>
    </div>
</div>

<script>
    // رابط المحرك الخاص بك
    const API_URL = "https://script.google.com/macros/s/AKfycbwqGrClXch4rzYL05LcjBNwwm4g_kheCuX8_clfvBYpfPQaUaKp_N-nTBURsV_rUfvUdA/exec";

    async function sendData(actionType) {
        const resDiv = document.getElementById("result");
        resDiv.innerText = "جاري التنفيذ...";

        try {
            let options = { method: "POST" };
            let url = API_URL;
            let payload = { action: actionType };

            if (actionType === 'CREATE') {
                payload.documentId = document.getElementById("docId").value;
                payload.data = {
                    basic_info: { canonicalNameAr: document.getElementById("nameAr").value },
                    macronutrients: { calories: parseFloat(document.getElementById("calories").value) }
                };
                options.body = JSON.stringify(payload);
            } else if (actionType === 'READ') {
                const id = document.getElementById("searchKey").value;
                url = `${API_URL}?action=READ&documentId=${id}`;
                options.method = "GET";
            } else if (actionType === 'SEARCH') {
                const query = document.getElementById("searchKey").value;
                url = `${API_URL}?action=SEARCH&query=${encodeURIComponent(query)}`;
                options.method = "GET";
            }

            const response = await fetch(url, options);
            const json = await response.json();
            resDiv.innerText = JSON.stringify(json, null, 2);
        } catch (e) {
            resDiv.innerText = "خطأ: " + e.message;
        }
    }
</script>
</body>
</html>
