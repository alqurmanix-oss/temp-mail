<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQX Mobile Fast Panel</title>
    <style>
        body { background: #0b0f19; color: #f8fafc; font-family: system-ui, sans-serif; padding: 15px; margin: 0; }
        .container { max-width: 100%; margin: 0 auto; }
        h1 { color: #38bdf8; font-size: 1.4rem; text-align: center; margin-bottom: 20px; }
        .card { background: #131d31; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #1e293b; }
        label { font-size: 0.8rem; color: #94a3b8; display: block; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin-top: 5px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; background: #0ea5e9; color: #0b0f19; border: none; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 15px; font-size: 1rem; cursor: pointer; }
        button.search { background: #22c55e; color: #fff; }
        #result { background: #070a12; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.75rem; white-space: pre-wrap; margin-top: 10px; max-height: 220px; overflow-y: auto; color: #38bdf8; border: 1px solid #1e293b; }
    </style>
</head>
<body>
<div class="container">
    <h1>AQX Mobile Dashboard</h1>

    <div class="card">
        <h3>إضافة أو تحديث مكون (GET Mode)</h3>
        <label>المعرف (Document ID)</label>
        <input type="text" id="docId" value="ing_banana_raw_100g">
        
        <label>الاسم بالعربية</label>
        <input type="text" id="nameAr" value="موز، طازج">

        <label>السعرات الحرارية</label>
        <input type="number" id="calories" value="89">

        <button onclick="sendViaGet('CREATE')">إضافة للقاعدة فوراً</button>
    </div>

    <div class="card">
        <h3>بحث أو جلب مكون</h3>
        <label>المعرف أو كلمة البحث</label>
        <input type="text" id="searchKey" value="ing_banana_raw_100g">
        
        <button onclick="sendViaGet('READ')">جلب بالمعرف</button>
        <button class="search" onclick="sendViaGet('SEARCH')">بحث ذكي</button>
    </div>

    <div class="card">
        <h3>سجل الاستجابة</h3>
        <div id="result">جاهز للتنفيذ...</div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwqGrClXch4rzYL05LcjBNwwm4g_kheCuX8_clfvBYpfPQaUaKp_N-nTBURsV_rUfvUdA/exec";

    async function sendViaGet(action) {
        const resDiv = document.getElementById("result");
        resDiv.innerText = "جاري الاتصال بالمحرك...";

        const docId = document.getElementById("docId").value.trim();
        const nameAr = document.getElementById("nameAr").value.trim();
        const calories = document.getElementById("calories").value.trim();
        const searchKey = document.getElementById("searchKey").value.trim();

        let finalUrl = `${API_URL}?action=${action}`;

        if (action === 'CREATE' || action === 'UPDATE') {
            if (!docId) { alert("أدخل المعرف!"); return; }
            // نمرر البيانات عبر بارامترات الـ URL لتجنب مشاكل الـ POST والـ CORS نهائياً
            finalUrl += `&documentId=${encodeURIComponent(docId)}&nameAr=${encodeURIComponent(nameAr)}&calories=${calories}`;
        } else if (action === 'READ') {
            if (!searchKey) { alert("أدخل المعرف للبحث!"); return; }
            finalUrl += `&documentId=${encodeURIComponent(searchKey)}`;
        } else if (action === 'SEARCH') {
            if (!searchKey) { alert("أدخل كلمة للبحث عنها!"); return; }
            finalUrl += `&query=${encodeURIComponent(searchKey)}`;
        }

        try {
            const response = await fetch(finalUrl);
            const text = await response.text();
            try {
                const json = JSON.parse(text);
                resDiv.innerText = JSON.stringify(json, null, 2);
            } catch {
                resDiv.innerText = text;
            }
        } catch (e) {
            resDiv.innerText = "خطأ في الاتصال: " + e.message;
        }
    }
</script>
</body>
</html>
